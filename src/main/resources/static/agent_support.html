<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropTech — Solicitudes de soporte</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="/proptech_utils.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--navy:#131936;--accent:#4A6FE3;--accent-light:#6B8AFF;--border:rgba(19,25,54,0.12);--text-muted:#8A90A0;--sidebar-w:220px;--bg:#F5F6FA;--text:#1a1d2e;}
    html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);}
    .app{display:flex;height:100vh;overflow:hidden;}
    .sidebar{width:var(--sidebar-w);background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;}
    .sidebar-logo{padding:24px 20px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.08);}
    .logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;}
    .logo-icon svg{width:18px;height:18px;fill:white;}
    .logo-name{font-size:16px;font-weight:600;color:white;}
    .sidebar-section{padding:16px 12px 8px;}
    .sidebar-label{font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.35);padding:0 8px;margin-bottom:6px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;color:rgba(255,255,255,0.5);cursor:pointer;transition:all 0.15s;text-decoration:none;margin-bottom:2px;}
    .nav-item svg{width:17px;height:17px;flex-shrink:0;}
    .nav-item:hover{background:rgba(255,255,255,0.08);color:white;}
    .nav-item.active{background:rgba(74,111,227,0.25);color:white;font-weight:500;}
    .sidebar-footer{margin-top:auto;padding:16px 12px;border-top:1px solid rgba(255,255,255,0.08);}
    .user-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;}
    .user-card:hover{background:rgba(255,255,255,0.06);}
    .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:white;flex-shrink:0;}
    .user-name{font-size:13px;font-weight:500;color:white;}
    .user-role{font-family:'Jost',sans-serif;font-size:11px;color:rgba(255,255,255,0.4);}
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .topbar{padding:16px 28px;border-bottom:1px solid var(--border);background:white;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .page-title{font-size:18px;font-weight:500;}
    .btn{padding:8px 16px;border-radius:8px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;border:none;display:flex;align-items:center;gap:6px;}
    .btn-primary{background:var(--accent);color:white;}
    .btn-primary:hover{background:var(--accent-light);}
    .btn-ghost{background:var(--bg);color:var(--text-muted);border:1px solid var(--border);}
    .btn-ghost:hover{background:#eef0f8;}
    .btn-sm{padding:5px 12px;font-size:12px;}
    .btn-success{background:rgba(29,158,117,0.1);color:#1D9E75;border:1px solid rgba(29,158,117,0.2);}
    .btn-success:hover{background:rgba(29,158,117,0.2);}
    .btn-danger{background:rgba(226,75,74,0.1);color:#E24B4A;border:1px solid rgba(226,75,74,0.2);}
    .btn-danger:hover{background:rgba(226,75,74,0.2);}
    .btn svg{width:14px;height:14px;}
    .content{flex:1;overflow-y:auto;padding:28px;}
    .queue-banner{background:white;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
    .queue-left{display:flex;align-items:center;gap:14px;}
    .queue-icon{width:40px;height:40px;border-radius:10px;background:rgba(74,111,227,0.1);display:flex;align-items:center;justify-content:center;}
    .queue-icon svg{width:20px;height:20px;color:var(--accent);}
    .queue-title{font-size:14px;font-weight:500;}
    .queue-sub{font-family:'Jost',sans-serif;font-size:12px;color:var(--text-muted);margin-top:2px;}
    .next-card{background:rgba(74,111,227,0.04);border:1px solid rgba(74,111,227,0.2);border-radius:12px;padding:18px 20px;margin-bottom:20px;display:none;}
    .next-card.visible{display:block;}
    .next-card-label{font-family:'Jost',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
    .next-card-msg{font-size:14px;color:var(--text);line-height:1.5;padding:12px;background:white;border-radius:8px;border:1px solid var(--border);margin-bottom:10px;}
    .next-card-meta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px;}
    .next-meta-item{display:flex;align-items:center;gap:6px;font-family:'Jost',sans-serif;font-size:12px;color:var(--text-muted);}
    .next-meta-item svg{width:13px;height:13px;flex-shrink:0;}
    .next-meta-item a{color:var(--accent);text-decoration:none;}
    .next-meta-item a:hover{text-decoration:underline;}
    .next-card-actions{display:flex;gap:8px;}
    .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
    .req-card{background:white;border:1px solid var(--border);border-radius:12px;padding:18px;transition:all 0.15s;}
    .req-card:hover{box-shadow:0 2px 12px rgba(74,111,227,0.08);}
    .req-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
    .req-client-name{font-size:13px;font-weight:500;color:var(--text);}
    .req-client-phone{font-family:'Jost',sans-serif;font-size:11px;color:var(--text-muted);margin-top:2px;}
    .req-prop{font-family:'Jost',sans-serif;font-size:11px;color:var(--text-muted);margin-top:1px;}
    .badge{font-size:11px;padding:3px 10px;border-radius:99px;font-family:'Jost',sans-serif;font-weight:500;white-space:nowrap;}
    .b-PENDING{background:rgba(74,111,227,0.1);color:var(--accent);}
    .b-ATTENDED{background:rgba(29,158,117,0.1);color:#1D9E75;}
    .b-CANCELLED{background:rgba(88,94,99,0.1);color:var(--text-muted);}
    .req-msg{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:10px;padding:10px;background:var(--bg);border-radius:8px;}
    .req-date{font-family:'Jost',sans-serif;font-size:11px;color:var(--text-muted);margin-bottom:10px;}
    .req-actions{display:flex;gap:6px;}
    .empty{text-align:center;padding:60px;color:var(--text-muted);}
    .empty-icon{font-size:40px;margin-bottom:10px;}
    .empty-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:4px;}
  </style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V21H3V9.5z"/></svg></div>
      <span class="logo-name">PropTech</span>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Mi gestion</div>
      <a href="agent_dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
      <a href="agent_properties.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.5L12 3l9 6.5V21H3V9.5z"/></svg>Mis inmuebles</a>
      <a href="agent_visits.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Mis visitas</a>
      <a href="agent_operations.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/></svg>Operaciones</a>
      <a href="agent_support.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Solicitudes</a>
      <a href="agent_potential_clients.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Clientes potenciales</a>
    </div>
    <div class="sidebar-footer">
      <div class="user-card" onclick="logout()">
        <div class="avatar" id="av">AS</div>
        <div><div class="user-name" id="uname">Asesor</div><div class="user-role">Asesor · Cerrar sesion</div></div>
      </div>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <span class="page-title">Solicitudes de soporte</span>
      <button class="btn btn-primary" onclick="attendNext()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>
        Atender siguiente
      </button>
    </div>

    <div class="content">
      <div class="queue-banner">
        <div class="queue-left">
          <div class="queue-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
          <div>
            <div class="queue-title">Cola de solicitudes pendientes</div>
            <div class="queue-sub">Se atienden en orden de llegada</div>
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:22px;font-weight:600;color:var(--accent)" id="q-count">—</div>
          <div style="font-family:'Jost',sans-serif;font-size:12px;color:var(--text-muted)">pendientes</div>
        </div>
      </div>

      <div class="next-card" id="next-card">
        <div class="next-card-label">Siguiente en cola</div>
        <div class="next-card-msg" id="next-msg">—</div>
        <div class="next-card-meta">
          <span class="next-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span id="next-client">—</span>
          </span>
          <span class="next-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.5"/></svg>
            <a id="next-phone" href="#">—</a>
          </span>
          <span class="next-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.5L12 3l9 6.5V21H3V9.5z"/></svg>
            <span id="next-prop">—</span>
          </span>
          <span class="next-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="next-date">—</span>
          </span>
        </div>
        <div class="next-card-actions">
          <button class="btn btn-success btn-sm" onclick="attendNext()">Atender</button>
        </div>
      </div>

      <div style="font-size:14px;font-weight:500;color:var(--text);margin-bottom:16px;">Historial de solicitudes</div>

      <div class="cards-grid" id="reqs-grid">
        <div style="color:var(--text-muted);font-size:13px;">Cargando...</div>
      </div>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:8080';
  const user = JSON.parse(sessionStorage.getItem('user') || '{}');
  if (!user.role) window.location.href = 'proptech_login.html';
  if (user.name) {
    document.getElementById('uname').textContent = user.name;
    document.getElementById('av').textContent = user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  }
  function logout() { sessionStorage.clear(); window.location.href = 'proptech_login.html'; }

  const STATUS_LABEL = { PENDING:'Pendiente', ATTENDED:'Atendida', CANCELLED:'Cancelada' };

  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('es-CO', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  }

  async function load() {
    const countRes = await fetch(`${API}/agents/${user.cedula}/support-requests/count`).catch(() => null);
    document.getElementById('q-count').textContent = countRes?.ok ? await countRes.json() : '0';

    const nextRes = await fetch(`${API}/agents/${user.cedula}/support-requests/next`).catch(() => null);
    const nextCard = document.getElementById('next-card');
    if (nextRes?.ok) {
      const next = await nextRes.json();
      if (next?.id) {
        document.getElementById('next-msg').textContent    = next.message || '—';
        document.getElementById('next-client').textContent = next.client?.name || '—';
        document.getElementById('next-prop').textContent   = next.property?.address || '—';
        document.getElementById('next-date').textContent   = fmtDate(next.date);
        const phone = next.client?.phone;
        const phoneEl = document.getElementById('next-phone');
        if (phone) { phoneEl.textContent = phone; phoneEl.href = `tel:${phone}`; }
        else { phoneEl.textContent = '—'; phoneEl.removeAttribute('href'); }
        nextCard.classList.add('visible');
      } else {
        nextCard.classList.remove('visible');
      }
    } else {
      nextCard.classList.remove('visible');
    }

    const histRes = await fetch(`${API}/agents/${user.cedula}/support-requests/history`).catch(() => null);
    if (histRes?.ok) renderReqs(await histRes.json());
  }

  function renderReqs(reqs) {
    const grid = document.getElementById('reqs-grid');
    if (!reqs.length) {
      grid.innerHTML = `<div class="empty"><div class="empty-icon">&#128172;</div><div class="empty-title">Sin solicitudes en el historial</div></div>`;
      return;
    }
    grid.innerHTML = reqs.map(r => {
      const phone = r.client?.phone;
      const phoneHtml = phone ? `<a href="tel:${phone}" style="color:var(--accent);text-decoration:none;">${phone}</a>` : '—';
      const canAct = r.status === 'PENDING';
      return `<div class="req-card">
        <div class="req-card-header">
          <div>
            <div class="req-client-name">${r.client?.name || '—'}</div>
            <div class="req-client-phone">${phoneHtml}</div>
            <div class="req-prop">${r.property?.address || '—'}</div>
          </div>
          <span class="badge b-${r.status || 'PENDING'}">${STATUS_LABEL[r.status] || r.status || 'Pendiente'}</span>
        </div>
        <div class="req-msg">${r.message || '—'}</div>
        <div class="req-date">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:12px;height:12px;vertical-align:middle;margin-right:4px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ${fmtDate(r.date)}
        </div>
        ${canAct ? `<div class="req-actions">
          <button class="btn btn-sm btn-success" onclick="attendNext()">Atender siguiente</button>
          <button class="btn btn-sm btn-danger" onclick="cancelReq('${r.id}')">Cancelar</button>
        </div>` : ''}
      </div>`;
    }).join('');
  }

  let _attending = false;
  async function attendNext() {
    if (_attending) return;
    _attending = true;
    const btn = document.querySelector('.btn-primary');
    if (btn) { btn.disabled = true; btn.textContent = 'Atendiendo...'; }

    const res = await fetch(`${API}/agents/${user.cedula}/support-requests/attend`, { method: 'POST' }).catch(() => null);

    if (btn) { btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M5 13l4 4L19 7"/></svg> Atender siguiente'; }
    _attending = false;

    if (res?.ok) {
      ptToast('success', 'Solicitud atendida', 'Se proceso correctamente y paso al historial');
      load();
    } else {
      const e = await res?.json().catch(() => ({}));
      ptToast('warning', 'Sin solicitudes pendientes', e?.message || 'No hay solicitudes en la cola');
    }
  }

  async function cancelReq(id) {
    const ok = await ptConfirm({
      title: 'Cancelar solicitud',
      message: '¿Confirmas la cancelacion de esta solicitud de soporte?',
      tone: 'danger',
      confirmText: 'Si, cancelar',
      cancelText: 'No'
    });
    if (!ok) return;
    const res = await fetch(`${API}/agents/${user.cedula}/support-requests/${id}/cancel`, { method: 'PATCH' }).catch(() => null);
    if (res?.ok) {
      ptToast('success', 'Solicitud cancelada', 'Se cancelo correctamente');
      load();
    } else {
      const e = await res?.json().catch(() => ({}));
      ptToast('error', 'Error al cancelar', e?.message || 'No se pudo cancelar la solicitud');
    }
  }

  load();
</script>
</body>
</html>
