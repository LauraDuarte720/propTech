<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropTech Admin — Asesores</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--navy:#131936;--slate:#585E63;--black:#05060F;--white:#FFFFFF;--accent:#4A6FE3;--accent-light:#6B8AFF;--border:rgba(255,255,255,0.08);--text-muted:#8A90A0;--sidebar-w:220px;}
    html,body{height:100%;font-family:'Outfit',sans-serif;background:#0A0C1B;color:var(--white);}
    .app{display:flex;height:100vh;overflow:hidden;}
    .sidebar{width:var(--sidebar-w);background:var(--navy);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
    .sidebar-logo{padding:24px 20px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
    .logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;}
    .logo-icon svg{width:18px;height:18px;fill:white;}
    .logo-name{font-size:16px;font-weight:600;}
    .sidebar-section{padding:16px 12px 8px;}
    .sidebar-label{font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);padding:0 8px;margin-bottom:6px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;color:var(--text-muted);cursor:pointer;transition:all 0.15s;text-decoration:none;margin-bottom:2px;}
    .nav-item svg{width:17px;height:17px;flex-shrink:0;}
    .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--white);}
    .nav-item.active{background:rgba(74,111,227,0.15);color:var(--white);font-weight:500;}
    .sidebar-footer{margin-top:auto;padding:16px 12px;border-top:1px solid var(--border);}
    .user-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;}
    .user-card:hover{background:rgba(255,255,255,0.05);}
    .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
    .user-name{font-size:13px;font-weight:500;}
    .user-role{font-family:'Jost',sans-serif;font-size:11px;color:var(--text-muted);}
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .topbar{padding:16px 28px;border-bottom:1px solid var(--border);background:rgba(19,25,54,0.4);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .page-title{font-size:18px;font-weight:500;letter-spacing:-0.3px;}
    .btn{padding:8px 16px;border-radius:8px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;border:none;display:flex;align-items:center;gap:6px;}
    .btn-primary{background:var(--accent);color:white;}
    .btn-primary:hover{background:var(--accent-light);}
    .btn-ghost{background:rgba(255,255,255,0.06);color:var(--white);border:1px solid var(--border);}
    .btn-ghost:hover{background:rgba(255,255,255,0.1);}
    .btn-sm{padding:5px 12px;font-size:12px;}
    .btn-danger{background:rgba(226,75,74,0.15);color:#FF7B7B;border:1px solid rgba(226,75,74,0.2);}
    .btn-danger:hover{background:rgba(226,75,74,0.25);}
    .btn svg{width:14px;height:14px;}
    .content{flex:1;overflow-y:auto;padding:28px;}
    .filters{display:flex;gap:10px;margin-bottom:20px;}
    .search-box{flex:1;position:relative;}
    .search-box input{width:100%;padding:9px 14px 9px 36px;background:var(--navy);border:1px solid var(--border);border-radius:8px;color:var(--white);font-family:'Outfit',sans-serif;font-size:13px;outline:none;transition:border 0.15s;}
    .search-box input:focus{border-color:var(--accent);}
    .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-muted);}
    .table-wrap{background:var(--navy);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
    table{width:100%;border-collapse:collapse;}
    th{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.8px;text-transform:uppercase;color:var(--text-muted);padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);}
    td{padding:13px 16px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:rgba(255,255,255,0.02);}
    .td-actions{display:flex;gap:6px;}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--navy);border:1px solid var(--border);border-radius:16px;padding:28px;width:520px;max-height:85vh;overflow-y:auto;animation:fadeUp 0.2s ease;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .modal-title{font-size:17px;font-weight:500;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
    .modal-title button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .form-group{display:flex;flex-direction:column;gap:6px;}
    .form-group.full{grid-column:1/-1;}
    label{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.8px;text-transform:uppercase;color:var(--text-muted);}
    input[type=text],input[type=password],input[type=number],select.form-select{width:100%;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:var(--white);font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:border 0.15s;}
    input:focus,select.form-select:focus{border-color:var(--accent);}
    select.form-select option{background:var(--navy);}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
    .agent-initials{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
    .td-agent{display:flex;align-items:center;gap:10px;}
    .deals-bar{width:80px;height:4px;background:rgba(255,255,255,0.08);border-radius:99px;margin-top:4px;}
    .deals-fill{height:4px;border-radius:99px;background:var(--accent);}
  </style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V21H3V9.5z"/></svg></div>
      <span class="logo-name">PropTech</span>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">General</div>
      <a href="admin_dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard
      </a>
      <a href="admin_properties.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.5L12 3l9 6.5V21H3V9.5z"/></svg>Inmuebles
      </a>
      <a href="admin_agents.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M5.5 20a7 7 0 0 1 13 0"/></svg>Asesores
      </a>
      <a href="admin_operations.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2"/></svg>Operaciones
      </a>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Monitoreo</div>
      <a href="admin_alerts.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg>Alertas
      </a>
    </div>
    <div class="sidebar-footer">
      <div class="user-card" onclick="logout()">
        <div class="avatar">AD</div>
        <div>
          <div class="user-name">Administrador</div>
          <div class="user-role">Admin · Cerrar sesión</div>
        </div>
      </div>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <span class="page-title">Asesores</span>
      <button class="btn btn-primary" onclick="openModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Registrar asesor
      </button>
    </div>

    <div class="content">
      <div class="filters">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" placeholder="Buscar por nombre o cédula..." oninput="filterAgents(this.value)">
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Asesor</th>
            <th>Cédula</th>
            <th>Contacto</th>
            <th>Zona asignada</th>
            <th>Cierres</th>
            <th>Acciones</th>
          </tr></thead>
          <tbody id="agents-tbody">
          <tr><td colspan="6" style="color:var(--text-muted);text-align:center;padding:32px;">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-title-txt">Registrar asesor</span>
      <button onclick="closeModal()">×</button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Cédula</label>
        <input type="text" id="f-cedula" placeholder="Número de cédula">
      </div>
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="f-name" placeholder="Nombre y apellido">
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="f-username" placeholder="nombre.usuario">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="f-password" placeholder="Mínimo 8 caracteres">
      </div>
      <div class="form-group">
        <label>Contacto / Teléfono</label>
        <input type="text" id="f-contact" placeholder="+57 300 000 0000">
      </div>
      <div class="form-group">
        <label>Cierres iniciales</label>
        <input type="number" id="f-deals" value="0" min="0">
      </div>
      <div class="form-group full">
        <label>Zona geográfica (ID)</label>
        <select class="form-select" id="f-zone">
          <option value="">Cargando zonas...</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveAgent()">Guardar</button>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:8080';
  const user = JSON.parse(sessionStorage.getItem('user') || '{}');
  if (!user.role) window.location.href = 'proptech_login.html';
  function logout() { sessionStorage.clear(); window.location.href = 'proptech_login.html'; }

  let allAgents = [];
  const colors = ['rgba(74,111,227,0.2)','rgba(29,158,117,0.2)','rgba(239,159,39,0.2)','rgba(226,75,74,0.2)','rgba(107,138,255,0.2)'];
  const tcolors = ['#6B8AFF','#3DD68C','#EF9F27','#FF7B7B','#B8AFFE'];

  async function loadZones() {
    const res = await fetch(`${API}/geographic-zones`).catch(()=>null);
    const sel = document.getElementById('f-zone');
    if (res && res.ok) {
      const zones = await res.json();
      sel.innerHTML = zones.map(z => `<option value="${z.id}">${z.city} — ${z.zone} (${z.neighborhood?.name||''})</option>`).join('');
    } else {
      sel.innerHTML = '<option value="default-zone-id">Zona por defecto</option>';
    }
  }

  async function loadAgents() {
    const res = await fetch(`${API}/agents`);
    if (!res.ok) return;
    allAgents = await res.json();
    renderAgents(allAgents);
  }

  function renderAgents(agents) {
    const tbody = document.getElementById('agents-tbody');
    if (!agents.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="color:var(--text-muted);text-align:center;padding:32px;">Sin asesores registrados</td></tr>';
      return;
    }
    const maxDeals = Math.max(...agents.map(a => a.closedDeals||0), 1);
    tbody.innerHTML = agents.map((a, i) => {
      const ci = i % colors.length;
      const initials = (a.name||'??').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      const pct = Math.round(((a.closedDeals||0)/maxDeals)*100);
      return `<tr>
        <td>
          <div class="td-agent">
            <div class="agent-initials" style="background:${colors[ci]};color:${tcolors[ci]}">${initials}</div>
            <span style="font-weight:500">${a.name}</span>
          </div>
        </td>
        <td style="color:var(--text-muted)">${a.cedula}</td>
        <td style="color:var(--text-muted)">${a.contact||'—'}</td>
        <td style="color:var(--text-muted)">${a.assignedZone?.city||'—'} / ${a.assignedZone?.zone||'—'}</td>
        <td>
          <div>${a.closedDeals||0}</div>
          <div class="deals-bar"><div class="deals-fill" style="width:${pct}%"></div></div>
        </td>
        <td>
          <div class="td-actions">
            <button class="btn btn-sm btn-danger" onclick="deleteAgent('${a.cedula}')">Eliminar</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  function filterAgents(q) {
    const filtered = allAgents.filter(a =>
            (a.name||'').toLowerCase().includes(q.toLowerCase()) ||
            (a.cedula||'').includes(q)
    );
    renderAgents(filtered);
  }

  function openModal() { document.getElementById('modal').classList.add('open'); }
  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  async function saveAgent() {
    const zoneId = document.getElementById('f-zone').value;
    const body = {
      cedula: document.getElementById('f-cedula').value,
      name: document.getElementById('f-name').value,
      username: document.getElementById('f-username').value,
      password: document.getElementById('f-password').value,
      contact: document.getElementById('f-contact').value,
      closedDeals: Number(document.getElementById('f-deals').value),
      assignedZoneId: zoneId
    };
    const res = await fetch(`${API}/agents`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if (res.ok) { closeModal(); loadAgents(); }
    else { const e = await res.json(); alert(e.message || 'Error al guardar'); }
  }

  async function deleteAgent(cedula) {
    if (!confirm('¿Eliminar este asesor?')) return;
    const res = await fetch(`${API}/agents/${cedula}`, { method:'DELETE' });
    if (res.ok) loadAgents();
  }

  loadAgents();
  loadZones();
</script>
</body>
</html>
