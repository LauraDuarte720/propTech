<!DOCTYPE html>
<html lang="es">
<head>
    <script src="/proptech_utils.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropTech Admin — Alertas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{--navy:#131936;--accent:#4A6FE3;--accent-light:#6B8AFF;--border:rgba(255,255,255,0.08);--text-muted:#8A90A0;--sidebar-w:220px;}
        html,body{height:100%;font-family:'Outfit',sans-serif;background:#0A0C1B;color:#fff;}
        .app{display:flex;height:100vh;overflow:hidden;}
        .sidebar{width:var(--sidebar-w);background:var(--navy);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
        .sidebar-logo{padding:24px 20px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
        .logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;}
        .logo-icon svg{width:18px;height:18px;fill:white;}
        .logo-name{font-size:16px;font-weight:600;}
        .sidebar-section{padding:16px 12px 8px;}
        .sidebar-label{font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);padding:0 8px;margin-bottom:6px;}
        .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;color:var(--text-muted);cursor:pointer;transition:all 0.15s;text-decoration:none;margin-bottom:2px;}
        .nav-item svg{width:17px;height:17px;flex-shrink:0;}
        .nav-item:hover{background:rgba(255,255,255,0.05);color:#fff;}
        .nav-item.active{background:rgba(74,111,227,0.15);color:#fff;font-weight:500;}
        .sidebar-footer{margin-top:auto;padding:16px 12px;border-top:1px solid var(--border);}
        .user-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;}
        .user-card:hover{background:rgba(255,255,255,0.05);}
        .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
        .user-name{font-size:13px;font-weight:500;}
        .user-role{font-family:'Jost',sans-serif;font-size:11px;color:var(--text-muted);}
        .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
        .topbar{padding:16px 28px;border-bottom:1px solid var(--border);background:rgba(19,25,54,0.4);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
        .page-title{font-size:18px;font-weight:500;}
        .btn{padding:8px 16px;border-radius:8px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:none;display:flex;align-items:center;gap:6px;transition:all 0.15s;}
        .btn-primary{background:var(--accent);color:white;}
        .btn-primary:hover{background:var(--accent-light);}
        .btn-ghost{background:rgba(255,255,255,0.06);color:#fff;border:1px solid var(--border);}
        .btn-ghost:hover{background:rgba(255,255,255,0.1);}
        .btn-sm{padding:5px 12px;font-size:12px;}
        .btn svg{width:14px;height:14px;}
        .content{flex:1;overflow-y:auto;padding:28px;}
        .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
        .sum-card{background:var(--navy);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;}
        .sum-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
        .sum-val{font-size:24px;font-weight:600;}
        .sum-label{font-family:'Jost',sans-serif;font-size:12px;color:var(--text-muted);}
        .filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
        select{padding:9px 14px;background:var(--navy);border:1px solid var(--border);border-radius:8px;color:#fff;font-family:'Jost',sans-serif;font-size:13px;outline:none;cursor:pointer;}
        .alerts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
        .alert-card{background:var(--navy);border:1px solid var(--border);border-radius:12px;padding:18px;transition:border 0.15s;}
        .alert-card.reviewed{opacity:0.5;}
        .alert-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
        .alert-level{font-size:11px;padding:3px 10px;border-radius:99px;font-family:'Jost',sans-serif;font-weight:500;}
        .l-HIGH{background:rgba(226,75,74,0.15);color:#FF7B7B;border:1px solid rgba(226,75,74,0.2);}
        .l-MEDIUM{background:rgba(239,159,39,0.15);color:#EF9F27;border:1px solid rgba(239,159,39,0.2);}
        .l-LOW{background:rgba(29,158,117,0.15);color:#3DD68C;border:1px solid rgba(29,158,117,0.2);}
        .alert-type{font-size:13px;font-weight:500;margin-bottom:6px;line-height:1.4;}
        .alert-subject{font-family:'Jost',sans-serif;font-size:12px;color:var(--text-muted);margin-bottom:12px;}
        .alert-meta{font-family:'Jost',sans-serif;font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center;}
        .reviewed-badge{font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,0.05);color:var(--text-muted);}
        .empty-state{color:var(--text-muted);font-size:13px;}
    </style>
</head>
<body>
<div class="app">
    <nav class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V21H3V9.5z"/></svg></div>
            <span class="logo-name">PropTech</span>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-label">General</div>
            <a href="admin_dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
            <a href="admin_properties.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.5L12 3l9 6.5V21H3V9.5z"/></svg>Inmuebles</a>
            <a href="admin_agents.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M5.5 20a7 7 0 0 1 13 0"/></svg>Asesores</a>
            <a href="admin_operations.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2"/></svg>Operaciones</a>
            <a href="admin_reports.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2zm0 0V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10m-6 0a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/></svg>Reportes
            </a>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-label">Monitoreo</div>
            <a href="admin_alerts.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg>Alertas</a>
        </div>
        <div class="sidebar-footer">
            <div class="user-card" onclick="logout()">
                <div class="avatar">AD</div>
                <div><div class="user-name">Administrador</div><div class="user-role">Admin · Cerrar sesión</div></div>
            </div>
        </div>
    </nav>

    <div class="main">
        <div class="topbar">
            <span class="page-title">Alertas anómalas</span>
            <button class="btn btn-ghost" onclick="runDetectors()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4v5h5M20 20v-5h-5M4 15a9 9 0 0 0 15 4M20 9A9 9 0 0 0 5 5"/></svg>
                Ejecutar detectores
            </button>
        </div>

        <div class="content">
            <div class="summary">
                <div class="sum-card">
                    <div class="sum-icon" style="background:rgba(226,75,74,0.15);">🔴</div>
                    <div><div class="sum-val" id="count-high">—</div><div class="sum-label">Nivel alto</div></div>
                </div>
                <div class="sum-card">
                    <div class="sum-icon" style="background:rgba(239,159,39,0.15);">🟡</div>
                    <div><div class="sum-val" id="count-medium">—</div><div class="sum-label">Nivel medio</div></div>
                </div>
                <div class="sum-card">
                    <div class="sum-icon" style="background:rgba(29,158,117,0.15);">✓</div>
                    <div><div class="sum-val" id="count-reviewed">—</div><div class="sum-label">Revisadas</div></div>
                </div>
            </div>

            <div class="filters">
                <select id="f-level" onchange="filterAlerts()"></select>
                <select id="f-type" onchange="filterAlerts()"></select>
                <select id="f-reviewed" onchange="applyReviewedFilter()">
                    <option value="">Todas</option>
                    <option value="false">Sin revisar</option>
                    <option value="true">Revisadas</option>
                </select>
            </div>

            <div class="alerts-grid" id="alerts-grid">
                <div class="empty-state">Cargando...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const API = 'http://localhost:8080';
    const user = JSON.parse(sessionStorage.getItem('user') || '{}');
    if (!user.role) window.location.href = 'proptech_login.html';
    function logout() { sessionStorage.clear(); window.location.href = 'proptech_login.html'; }

    // allAlerts guarda siempre el resultado completo del último fetch
    // para poder aplicar el filtro de reviewed localmente sin ir al backend
    let allAlerts = [];

    // ── Carga inicial — trae todas las alertas ────────────────────────────
    async function loadAlerts() {
        document.getElementById('f-level').value = '';
        document.getElementById('f-type').value = '';
        document.getElementById('f-reviewed').value = '';
        await fetchAndRender(`${API}/abnormal-alerts`);
    }

    // ── Filtro por nivel o tipo — llama al endpoint correspondiente ───────
    async function filterAlerts() {
        const level = document.getElementById('f-level').value;
        const type  = document.getElementById('f-type').value;

        let url;

        if (type) {
            // Filtro por tipo tiene prioridad → /abnormal-alerts/type/{type}
            url = `${API}/abnormal-alerts/type/${type}`;
        } else if (level) {
            // Solo nivel → /abnormal-alerts/level/{level}
            url = `${API}/abnormal-alerts/level/${level}`;
        } else {
            // Sin filtros → todas
            url = `${API}/abnormal-alerts`;
        }

        await fetchAndRender(url);

        // Si además hay filtro de reviewed, aplicarlo sobre el resultado
        applyReviewedFilter();
    }

    // ── Filtro reviewed — siempre local sobre allAlerts ───────────────────
    function applyReviewedFilter() {
        const rv = document.getElementById('f-reviewed').value;
        if (rv === '') {
            renderAlerts(allAlerts);
        } else {
            renderAlerts(allAlerts.filter(a => String(a.reviewed) === rv));
        }
    }

    // ── Fetch genérico — guarda en allAlerts y actualiza contadores ───────
    async function fetchAndRender(url) {
        const res = await fetch(url).catch(() => null);
        if (!res || !res.ok) {
            allAlerts = [];
            updateCounters([]);
            document.getElementById('alerts-grid').innerHTML =
                '<div class="empty-state">Sin alertas. Ejecuta los detectores para generarlas.</div>';
            return;
        }
        allAlerts = await res.json();
        updateCounters(allAlerts);
        renderAlerts(allAlerts);
    }

    function updateCounters(alerts) {
        document.getElementById('count-high').textContent     = alerts.filter(a => a.attentionLevel === 'HIGH').length;
        document.getElementById('count-medium').textContent   = alerts.filter(a => a.attentionLevel === 'MEDIUM').length;
        document.getElementById('count-reviewed').textContent = alerts.filter(a => a.reviewed).length;
    }

    function renderAlerts(alerts) {
        const grid = document.getElementById('alerts-grid');
        if (!alerts.length) {
            grid.innerHTML = '<div class="empty-state">Sin alertas para los filtros seleccionados.</div>';
            return;
        }
        grid.innerHTML = alerts.map(a => {
            const subject = a.property?.address || a.client?.name || a.agent?.name || '—';
            const ts = a.timestamp
                ? new Date(a.timestamp).toLocaleDateString('es-CO', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'})
                : '—';
            return `<div class="alert-card ${a.reviewed ? 'reviewed' : ''}">
                <div class="alert-card-header">
                    <span class="alert-level l-${a.attentionLevel}">${label(ATTENTION_LEVEL, a.attentionLevel)}</span>
                    ${!a.reviewed
                ? `<button class="btn btn-ghost btn-sm" onclick="markReviewed('${a.id}')">Marcar revisada</button>`
                : '<span class="reviewed-badge">✓ Revisada</span>'}
                </div>
                <div class="alert-type">${label(ALERT_ABNORMAL_TYPE, a.alertAbnormalType)}</div>
                <div class="alert-subject">${subject}</div>
                <div class="alert-meta">
                    <span>${ts}</span>
                    <span style="font-size:10px">${a.id?.slice(0,10) || ''}</span>
                </div>
            </div>`;
        }).join('');
    }

    async function markReviewed(id) {
        await fetch(`${API}/abnormal-alerts/${id}/review`, { method: 'PATCH' });
        loadAlerts();
    }

    async function runDetectors() {
        await fetch(`${API}/abnormal-alerts/run`, { method: 'POST' });
        loadAlerts();
    }

    populateSelect('f-level', ATTENTION_LEVEL, 'Todos los niveles');
    populateSelect('f-type', ALERT_ABNORMAL_TYPE, 'Todos los tipos');
    loadAlerts();
</script>
</body>
</html>
